<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honoka</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Honoka</h1>
    </header>

    <div class="section">
      <div class="status-row">
        <span class="status-label">頁面追蹤</span>
        <span id="trackingStatus" class="status-value">…</span>
      </div>
      <div class="status-row">
        <span class="status-label">已記錄頁面</span>
        <span id="trackedCount" class="status-value">0</span>
      </div>
      <div class="status-row">
        <span class="status-label">目前頁面</span>
        <span id="pageStatus" class="status-value">…</span>
      </div>
    </div>

    <div class="section hint">
      💡 同步到 Notion / AnyType 請透過 AI 助理
      <br>（Antigravity · Codex · Claude Desktop）
    </div>

    <div id="result" class="result hidden"></div>

    <footer>
      <a href="#" id="optionsLink">Doc Library</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
